name: Build Test Image
description: Builds the Docker image for testing (local load only)

inputs:
  app:
    required: true
    description: "App to build for"
  channel:
    required: true
    description: "Channel to build for"
  upstream_version:
    required: true
    description: "Upstream version to build"
  dockerfile:
    required: true
    description: "Dockerfile path"
  tag_testing:
    required: true
    description: "Tag for testing"
  platform:
    required: true
    description: "Single platform to build (e.g. linux/amd64 or linux/arm64). Must match the runner's native arch since we use `load: true`."
  public_token:
    required: true
    description: "Github token for authentication (public packages)"

runs:
  using: composite
  steps:
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (test)
      uses: docker/build-push-action@v6
      with:
        secrets: |
          "PUBLIC_PACKAGES_TOKEN=${{ inputs.public_token }}"
        build-args: |
          VERSION=${{ inputs.upstream_version }}
          CHANNEL=${{ inputs.channel }}
        context: .
        platforms: ${{ inputs.platform }}
        file: ${{ inputs.dockerfile }}
        load: true
        tags: |
          ghcr.io/ipromknight/${{ inputs.tag_testing }}
        # Cache is per-arch — sharing the same scope across arches causes
        # cross-arch layer reuse attempts that fail.
        cache-from: type=gha,scope=test-${{ inputs.app }}-${{ inputs.channel }}-${{ inputs.platform }}
        cache-to: type=gha,mode=max,scope=test-${{ inputs.app }}-${{ inputs.channel }}-${{ inputs.platform }}