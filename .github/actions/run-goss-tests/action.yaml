name: Run Goss Tests
description: Executes dgoss tests for a Docker image

inputs:
  tag_testing:
    required: true
    description: The full image tag (e.g. `app:testingz`)

  goss_config:
    required: true
    description: Path to the Goss YAML config (e.g. `apps/app/ci/goss.yaml`)

  goss_args:
    required: false
    default: ""
    description: Runtime args passed to `docker run` (e.g. entrypoint override)

runs:
  using: composite
  steps:
    # We install goss + dgoss manually rather than via e1himself/goss-installation-action
    # because that action hardcodes ARCH=amd64 and breaks when this job runs on an
    # ubuntu-24.04-arm runner. dgoss copies the goss binary INTO the target container
    # at runtime, so the binary's arch must match the test container's arch — which
    # in turn matches the runner's arch (we build single-platform test images with
    # `load: true`).
    - name: Install Goss + dgoss
      shell: bash
      env:
        GOSS_VERSION: v0.3.18
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64)  GOSS_ARCH=amd64 ;;
          aarch64) GOSS_ARCH=arm64 ;;
          *)       echo "::error::Unsupported runner arch $(uname -m)"; exit 1 ;;
        esac
        sudo curl -fsSL -o /usr/local/bin/goss \
          "https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}/goss-linux-${GOSS_ARCH}"
        sudo chmod +x /usr/local/bin/goss
        sudo curl -fsSL -o /usr/local/bin/dgoss \
          "https://raw.githubusercontent.com/goss-org/goss/${GOSS_VERSION}/extras/dgoss/dgoss"
        sudo chmod +x /usr/local/bin/dgoss
        goss --version

    - name: Run Goss tests
      shell: bash
      env:
        DEBUG: true
        CONTAINER_RUNTIME: docker
        GOSS_OPTS: --retry-timeout 60s --sleep 2s --color --format documentation
        GOSS_FILES_STRATEGY: cp
      run: |
        echo "🔍 Mounting $(dirname "${{ inputs.goss_config }}") to /goss"

        full_path="${{ github.workspace }}/${{ inputs.goss_config }}"
        test -f "$full_path" || {
          echo "❌ Goss config not found at: $full_path"
          exit 1
        }

        cp "$full_path" ./goss.yaml
        export GOSS_FILE=./goss.yaml

        dgoss run ghcr.io/ipromknight/${{ inputs.tag_testing }} ${{ inputs.goss_args }}