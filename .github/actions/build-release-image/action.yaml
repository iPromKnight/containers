name: Build Single-Arch Image (load + push-by-digest)
description: |
  Builds a single-architecture image with two outputs in a single buildx
  invocation:
    1. type=docker (load) — the image is loaded into the runner's local
       Docker daemon under `tag_testing` so dgoss can run goss against it
       in a sibling step.
    2. type=image,push-by-digest=true — the same image is pushed to ghcr.io
       by digest only (no tag). The digest is exported as an artifact for
       the multi-arch merge job to assemble into a tagged manifest later.

  This replaces the old build-test-image + build-release-image split which
  built the same image twice on the same runner (once for goss, once for
  push), wasting CI minutes.

inputs:
  app:
    required: true
    description: "App to build for"
  channel:
    required: true
    description: "Channel to build for"
  upstream_version:
    required: true
    description: "Upstream version to build"
  dockerfile:
    required: true
    description: "Dockerfile path"
  label_type:
    required: true
    description: "Label type to use (org.opencontainers.image or .base)"
  build_date:
    required: true
    description: "Build date"
  platform:
    required: true
    description: "Single platform to build (e.g. linux/amd64 or linux/arm64)"
  image:
    required: true
    description: "Image repo (e.g. ghcr.io/ipromknight/altmount). Used for digest push."
  tag_testing:
    required: true
    description: "Local tag for the loaded image so dgoss can find it (e.g. altmount:testingz). Repo-prefixed automatically."
  push:
    required: false
    default: "true"
    description: |
      Whether to push the image to the registry. When `false`, the image is
      still loaded locally so goss can test it, but the registry push is
      skipped and no digest artifact is uploaded. Used for dry-run flows.
  token:
    required: true
    description: "GitHub token for ghcr login"
  public_token:
    required: true
    description: "GitHub token for authentication (public packages)"

outputs:
  digest:
    description: "Digest of the pushed manifest for this arch"
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build (load + push by digest in one invocation)
      id: build
      uses: docker/build-push-action@v6
      with:
        secrets: |
          "PUBLIC_PACKAGES_TOKEN=${{ inputs.public_token }}"
        build-args: |
          VERSION=${{ inputs.upstream_version }}
          CHANNEL=${{ inputs.channel }}
        labels: |
          ${{ inputs.label_type }}.created=${{ inputs.build_date }}
          ${{ inputs.label_type }}.title=${{ inputs.app }} (${{ inputs.channel }})
          ${{ inputs.label_type }}.version=${{ inputs.upstream_version }}
          ${{ inputs.label_type }}.authors=iPromKnight <promknight@proton.me>
          ${{ inputs.label_type }}.url=https://github.com/ipromknight/containers/apps/${{ inputs.app }}
          ${{ inputs.label_type }}.build.url=https://github.com/ipromknight/containers/actions/runs/${{ github.run_id }}
          ${{ inputs.label_type }}.documentation=https://github.com/ipromknight/containers/apps/${{ inputs.app }}/README.md
          ${{ inputs.label_type }}.revision=${{ github.sha }}
        context: .
        platforms: ${{ inputs.platform }}
        file: ${{ inputs.dockerfile }}
        # Two exporters in a single buildx invocation, each with its own name.
        # We deliberately do NOT set the top-level `tags:` input — that input
        # propagates the tag to ALL exporters, and `push-by-digest=true`
        # forbids tagged refs ("can't push tagged ref ... by digest"). Naming
        # each exporter inline keeps them independent:
        #   - type=docker → loaded into local daemon under tag_testing for goss
        #   - type=image  → pushed to ghcr by digest only (no tag)
        # Requires buildkit/buildx 0.13+, which GHA runners have.
        outputs: |
          type=docker,name=ghcr.io/ipromknight/${{ inputs.tag_testing }}
          ${{ inputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', inputs.image) || '' }}
        cache-from: type=gha,scope=${{ inputs.app }}-${{ inputs.channel }}-${{ inputs.platform }}
        cache-to: type=gha,mode=max,scope=${{ inputs.app }}-${{ inputs.channel }}-${{ inputs.platform }}

    # Write the digest to a file the merge job can pick up via download-artifact.
    # Artifact names must be unique across the run, so include arch in the name.
    # The file content is just the digest string (sha256:...).
    - name: Export digest as artifact
      if: ${{ inputs.push == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/digests
        digest='${{ steps.build.outputs.digest }}'
        arch="${PLATFORM##*/}"
        echo "$digest" > "/tmp/digests/${arch}"
      env:
        PLATFORM: ${{ inputs.platform }}

    - name: Upload digest artifact
      if: ${{ inputs.push == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        # name-mangling: per-(app, channel, arch). Merge job globs on
        # `digests-${app}-${channel}-*` to find all arches for this image.
        name: digests-${{ inputs.app }}-${{ inputs.channel }}-${{ env.ARCH }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
      env:
        ARCH: ${{ inputs.platform == 'linux/amd64' && 'amd64' || (inputs.platform == 'linux/arm64' && 'arm64' || 'unknown') }}
