---
name: "Manual: Release Single Image"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "App / channel to build (app/channel)"
        required: true
        type: choice
        default: "altmount/dev"
        options:
          - alpine/3.23
          - altmount/main
          - altmount/dev
          - audiobookshelf/main
          - decypharr/main
          - gluetun/main
          - gort/main
          - houndarr/main
          - imagemaid/main
          - jellyfin/stable
          - kometa/main
          - mcjava2bedrock/main
          - nzbdav/main
          - nzbhydra2/main
          - orionzb/main
          - orionznab/main
          - pia/master
          - plex/stable
          - profilarr/main
          - proton-gluetun-updater/main
          - prowlarr/nightly
          - radarr/main
          - rclone-manager/main
          - sonarr/main
          - tautulli/main
          - trailerfin_rust/main
          - tuliprox/main
          - ubuntu/noble
      dryRun:
        description: "Only print, don't build or push"
        required: false
        default: false
        type: boolean

env:
  TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DRY_RUN: ${{ github.event.inputs.dryRun }}

jobs:
  test:
    name: "Test image"
    runs-on: ubuntu-24.04
    outputs:
      app:          ${{ steps.parse.outputs.app }}
      channel:      ${{ steps.parse.outputs.channel }}
      build_matrix: ${{ steps.expand.outputs.build_matrix }}
    steps:
      - name: Parse target
        id: parse
        shell: bash
        run: |
          target='${{ github.event.inputs.target }}'
          app="${target%%/*}"
          channel="${target#*/}"
          if [[ -z "$app" || -z "$channel" || "$app" == "$channel" ]]; then
            echo "❌ invalid target: $target (expected app/channel)" >&2
            exit 1
          fi
          echo "app=$app"         >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "::notice::Selected app=$app channel=$channel"

      - name: Dry run summary
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          echo "DRY RUN ENABLED – no image will be built or pushed"
          echo "Target: ${{ steps.parse.outputs.app }} / ${{ steps.parse.outputs.channel }}"

      - name: Checkout
        uses: actions/checkout@v3

      - name: Extract build metadata
        id: vars
        uses: ./.github/actions/setup-vars
        with:
          app: ${{ steps.parse.outputs.app }}
          channel: ${{ steps.parse.outputs.channel }}

      - name: Expand to per-platform build matrix
        id: expand
        shell: bash
        run: |
          set -euo pipefail
          # `chan_platforms_json` is a JSON array like ["linux/amd64","linux/arm64"].
          # Turn it into [{app, channel, platform, runner}, ...].
          matrix="$(jq -c --null-input \
            --arg app     '${{ steps.parse.outputs.app }}' \
            --arg channel '${{ steps.parse.outputs.channel }}' \
            --argjson platforms '${{ steps.vars.outputs.chan_platforms_json }}' '
              $platforms | map({
                app:      $app,
                channel:  $channel,
                platform: .,
                runner: (
                  if . == "linux/amd64" then "ubuntu-24.04"
                  elif . == "linux/arm64" then "ubuntu-24.04-arm"
                  else "ubuntu-latest"
                  end
                )
              })
          ')"
          echo "build_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Build matrix:"
          jq . <<< "$matrix"

      - name: Validate metadata
        uses: ./.github/actions/validate-cue
        with:
          app: ${{ steps.parse.outputs.app }}

      - name: Build test image
        if: ${{ env.DRY_RUN != 'true' }}
        uses: ./.github/actions/build-test-image
        with:
          app: ${{ steps.parse.outputs.app }}
          channel: ${{ steps.parse.outputs.channel }}
          upstream_version: ${{ steps.vars.outputs.chan_upstream_version }}
          dockerfile: ${{ steps.vars.outputs.chan_dockerfile }}
          tag_testing: ${{ steps.vars.outputs.chan_tag_testing }}
          public_token: ${{ secrets.PUBLIC_PACKAGES }}

      - name: Run Goss tests
        if: ${{ env.DRY_RUN != 'true' && steps.vars.outputs.chan_tests_enabled == 'true' }}
        uses: ./.github/actions/run-goss-tests
        with:
          tag_testing: ${{ steps.vars.outputs.chan_tag_testing }}
          goss_config: ${{ steps.vars.outputs.chan_goss_config }}
          goss_args: ${{ steps.vars.outputs.chan_goss_args }}

  release-build:
    name: "Release: ${{ matrix.entry.platform }}"
    runs-on: ${{ matrix.entry.runner }}
    needs: [test]
    if: |
      always()
      && needs.test.result == 'success'
      && !cancelled()
      && github.event.inputs.dryRun != 'true'
    strategy:
      matrix:
        entry: ${{ fromJson(needs.test.outputs.build_matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Extract build metadata
        id: vars
        uses: ./.github/actions/setup-vars
        with:
          app: ${{ matrix.entry.app }}
          channel: ${{ matrix.entry.channel }}

      - name: Build and push release image (by digest)
        uses: ./.github/actions/build-release-image
        with:
          app: ${{ matrix.entry.app }}
          channel: ${{ matrix.entry.channel }}
          upstream_version: ${{ steps.vars.outputs.chan_upstream_version }}
          dockerfile: ${{ steps.vars.outputs.chan_dockerfile }}
          label_type: ${{ steps.vars.outputs.chan_label_type }}
          build_date: ${{ steps.vars.outputs.chan_build_date }}
          platform: ${{ matrix.entry.platform }}
          image: ${{ steps.vars.outputs.chan_image }}
          token: ${{ secrets.GH_PAT }}
          public_token: ${{ secrets.PUBLIC_PACKAGES }}

  release-merge:
    name: "Merge multi-arch manifest"
    runs-on: ubuntu-24.04
    needs: [test, release-build]
    if: |
      always()
      && needs.release-build.result == 'success'
      && !cancelled()
      && github.event.inputs.dryRun != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Extract build metadata
        id: vars
        uses: ./.github/actions/setup-vars
        with:
          app: ${{ needs.test.outputs.app }}
          channel: ${{ needs.test.outputs.channel }}

      - name: Merge per-arch digests into multi-arch manifest
        uses: ./.github/actions/merge-release-manifests
        with:
          app: ${{ needs.test.outputs.app }}
          channel: ${{ needs.test.outputs.channel }}
          image: ${{ steps.vars.outputs.chan_image }}
          tag_rolling: ${{ steps.vars.outputs.chan_tag_rolling }}
          tag_version: ${{ steps.vars.outputs.chan_tag_version }}
          token: ${{ secrets.GH_PAT }}

  notify-success:
    runs-on: ubuntu-latest
    needs: [test, release-build, release-merge]
    if: |
      always()
      && needs.release-merge.result == 'success'
      && github.event.inputs.dryRun != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Notify success
        uses: ./.github/actions/notifications
        with:
          title: "Single image rebuild successful"
          tags: '${{ secrets.APPRISE_TAGS }}'
          apprise_configuration: '${{ secrets.APPRISE_CONFIG }}'
          gh_verification: '${{ secrets.GH_VERIFICATION }}'
          body: |
            ✅ **Image Rebuild Complete**

            - ${{ github.event.inputs.target }}

            ---
            🕐 Triggered manually
            🔗 Workflow: [${{ github.workflow }}](${{ github.run_url }})
            🔗 Repository: [${{ github.repository }}](${{ github.event.repository.html_url }})

  notify-failure:
    runs-on: ubuntu-latest
    needs: [test, release-build, release-merge]
    if: |
      always()
      && contains(needs.*.result, 'failure')
      && github.event.inputs.dryRun != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Notify failure
        uses: ./.github/actions/notifications
        with:
          title: "Single image rebuild failed"
          tags: '${{ secrets.APPRISE_TAGS }}'
          apprise_configuration: '${{ secrets.APPRISE_CONFIG }}'
          gh_verification: '${{ secrets.GH_VERIFICATION }}'
          body: |
            ❌ **Image Rebuild Failed**

            - ${{ github.event.inputs.target }}

            ---
            🕐 Triggered manually
            🔗 Workflow: [${{ github.workflow }}](${{ github.run_url }})
            🔗 Repository: [${{ github.repository }}](${{ github.event.repository.html_url }})
