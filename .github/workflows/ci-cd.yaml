---
name: "Image: Rebuild CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "!apps/**/metadata.json"
      - "!apps/**/README.md"

env:
  TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  get-changes:
    name: Collect changes
    runs-on: ubuntu-latest
    outputs:
      addedOrModifiedImages: ${{ steps.collect-changes.outputs.addedOrModifiedImages }}
      matrix:                ${{ steps.collect-changes.outputs.matrix }}
      build_matrix:          ${{ steps.collect-changes.outputs.build_matrix }}
      images:                ${{ steps.collect-changes.outputs.images }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get -y install moreutils jo

      - name: Checkout
        uses: actions/checkout@v5

      - name: Collect changes
        id: collect-changes
        uses: ./.github/actions/collect-changes

  generate-build-matrix:
    name: Generate matrix for building images
    runs-on: ubuntu-latest
    needs: [get-changes]
    outputs:
      matrix:       ${{ needs.get-changes.outputs.matrix }}
      build_matrix: ${{ needs.get-changes.outputs.build_matrix }}
      images:       ${{ needs.get-changes.outputs.images }}
    if: |
      always()
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
      && !cancelled()
      && needs.get-changes.outputs.matrix != '[]'
    steps:
      - name: Summary
        shell: bash
        run: |
          echo "Merge matrix produced by collect-changes:"
          echo '${{ needs.get-changes.outputs.matrix }}' | jq .
          echo
          echo "Build matrix (one entry per app/channel/platform):"
          echo '${{ needs.get-changes.outputs.build_matrix }}' | jq .

  validate-metadata:
    name: Validate metadata
    runs-on: ubuntu-latest
    needs: [generate-build-matrix]
    if: |
      always()
      && needs.generate-build-matrix.result == 'success'
      && !cancelled()
      && needs.generate-build-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate metadata
        uses: ./.github/actions/validate-cue
        with:
          matrix: ${{ needs.generate-build-matrix.outputs.matrix }}

  # One matrix entry per (app, channel, platform) on the matching native
  # runner. See .github/actions/build-and-test for the inner build+test loop.
  images-build:
    name: "Build: ${{ matrix.entry.app }} / ${{ matrix.entry.channel }} (${{ matrix.entry.platform }})"
    runs-on: ${{ matrix.entry.runner }}
    needs: [generate-build-matrix, validate-metadata]
    if: |
      always()
      && needs.validate-metadata.result == 'success'
      && !cancelled()
      && needs.generate-build-matrix.outputs.build_matrix != '[]'
    strategy:
      matrix:
        entry: ${{ fromJson(needs.generate-build-matrix.outputs.build_matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          app: ${{ matrix.entry.app }}
          channel: ${{ matrix.entry.channel }}
          platform: ${{ matrix.entry.platform }}
          token: ${{ secrets.GH_PAT }}
          public_token: ${{ secrets.PUBLIC_PACKAGES }}

  images-release-merge:
    name: "Merge: ${{ matrix.image.app }} / ${{ matrix.image.channel }}"
    runs-on: ubuntu-24.04
    needs: [generate-build-matrix, images-build]
    if: |
      always()
      && needs.images-build.result == 'success'
      && !cancelled()
      && needs.generate-build-matrix.outputs.matrix != '[]'
    strategy:
      matrix:
        image: ${{ fromJson(needs.generate-build-matrix.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract build metadata
        id: vars
        uses: ./.github/actions/setup-vars
        with:
          app: ${{ matrix.image.app }}
          channel: ${{ matrix.image.channel }}

      - name: Merge per-arch digests into multi-arch manifest
        uses: ./.github/actions/merge-release-manifests
        with:
          app: ${{ matrix.image.app }}
          channel: ${{ matrix.image.channel }}
          image: ${{ steps.vars.outputs.chan_image }}
          tag_rolling: ${{ steps.vars.outputs.chan_tag_rolling }}
          tag_version: ${{ steps.vars.outputs.chan_tag_version }}
          token: ${{ secrets.GH_PAT }}

  notify-success:
    runs-on: ubuntu-latest
    needs: [generate-build-matrix, validate-metadata, images-build, images-release-merge]
    if: |
      always()
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
      && !cancelled()
      && needs.generate-build-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Notify success
        uses: ./.github/actions/notifications
        with:
          title: "Image rebuilds successful"
          tags: '${{ secrets.APPRISE_TAGS }}'
          gh_verification: '${{ secrets.GH_VERIFICATION }}'
          apprise_configuration: '${{ secrets.APPRISE_CONFIG }}'
          body: |
            ✅ **Image Rebuilds Complete**

            The following images were successfully rebuilt:

            - ${{ join(fromJson(needs.generate-build-matrix.outputs.images || '[]'), '\n- ') }}

            ---
            🕐 Triggered by commit to `main`
            📅 Date: ${{ github.event.head_commit.timestamp }}
            🔗 Commit: [${{ github.event.head_commit.message }}](${{ github.event.head_commit.url }})
            🔗 Workflow: [${{ github.workflow }}](${{ github.run_url }})
            🔗 Repository: [${{ github.repository }}](${{ github.event.repository.html_url }})
  notify-failure:
    runs-on: ubuntu-latest
    needs: [generate-build-matrix, validate-metadata, images-build, images-release-merge]
    if: |
      always()
      && contains(needs.*.result, 'failure')
      && !cancelled()
      && needs.generate-build-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Notify failure
        uses: ./.github/actions/notifications
        with:
          title: "Image rebuilds failed"
          tags: '${{ secrets.APPRISE_TAGS }}'
          apprise_configuration: '${{ secrets.APPRISE_CONFIG }}'
          gh_verification: '${{ secrets.GH_VERIFICATION }}'
          body: |
            ❌ **Image Rebuilds Failed**

            The following images failed to rebuild:

            - ${{ join(fromJson(needs.generate-build-matrix.outputs.images || '[]'), '\n- ') }}

            ---
            🕐 Triggered by commit to `main`
            📅 Date: ${{ github.event.head_commit.timestamp }}
            🔗 Commit: [${{ github.event.head_commit.message }}](${{ github.event.head_commit.url }})
            🔗 Workflow: [${{ github.workflow }}](${{ github.run_url }})
            🔗 Repository: [${{ github.repository }}](${{ github.event.repository.html_url }})
